{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm p-4">
    <h1>{{ title }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'tasks:anime-page-list' %}" class="btn btn-outline-secondary">Назад</a>
    </form>
</div>
{% endblock %}
