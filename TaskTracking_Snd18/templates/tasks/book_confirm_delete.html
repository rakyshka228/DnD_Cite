{% extends 'base.html' %}
{% block content %}
<div class="container mt-3">
    <h1>Удалить запись</h1>
    <p>Вы уверены что хотите удалить? "{{ anime.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'tasks:anime-page-detail' pk=anime.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
